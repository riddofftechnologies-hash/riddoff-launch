<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - BootcampAdmin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#dad7ff",
                        "surface-variant": "#e4e1ee",
                        "on-primary-fixed": "#0f0069",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-tertiary-container": "#ffd2be",
                        "surface-dim": "#dcd8e5",
                        "on-primary-fixed-variant": "#3323cc",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f3effc",
                        "surface": "#fcf8ff",
                        "on-secondary-fixed": "#0b1c30",
                        "secondary": "#505f76",
                        "surface-container-low": "#f5f2ff",
                        "primary": "#3525cd",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#4d44e3",
                        "inverse-primary": "#c3c0ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "surface-container": "#f0ecf9",
                        "secondary-fixed": "#d3e4fe",
                        "tertiary-container": "#a44100",
                        "surface-container-highest": "#e4e1ee",
                        "primary-container": "#4f46e5",
                        "on-surface": "#1b1b24",
                        "background": "#fcf8ff",
                        "on-tertiary-fixed": "#351000",
                        "tertiary": "#7e3000",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#ffdbcc",
                        "outline-variant": "#c7c4d8",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#ffb695",
                        "secondary-container": "#d0e1fb",
                        "surface-container-high": "#eae6f4",
                        "inverse-surface": "#302f39",
                        "surface-bright": "#fcf8ff",
                        "on-surface-variant": "#464555",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-container": "#54647a",
                        "on-background": "#1b1b24",
                        "outline": "#777587",
                        "primary-fixed": "#e2dfff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-padding": "32px",
                        "base": "4px",
                        "md": "16px",
                        "sm": "8px",
                        "lg": "24px",
                        "xl": "32px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"]
                    },
                    "fontSize": {
                        "display-lg": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #fcf8ff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md">
<!-- Main Login Canvas -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Branding Header -->
<header class="mb-xl text-center">
<div class="flex items-center justify-center mb-sm">
<div class="bg-primary p-sm rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary text-[32px]" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">BootcampAdmin</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Enterprise Management System</p>
</header>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-xl">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">Welcome Back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please enter your credentials to continue.</p>
</div>
<form action="#" class="space-y-lg">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-[48px] pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="email" name="email" placeholder="admin@bootcamp.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-[48px] pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" type="checkbox"/>
<label class="ml-sm font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Remember this session</label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md px-lg rounded-lg shadow-sm hover:bg-primary-container hover:shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Bottom Divider -->
<div class="mt-xl pt-lg border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Need an account? 
                    <a class="text-primary font-semibold hover:underline" href="#">Contact Platform Admin</a>
</p>
</div>
</div>
<!-- System Status Footer -->
<footer class="mt-xl flex items-center gap-md">
<div class="flex items-center gap-xs">
<div class="w-2 h-2 rounded-full bg-[#10b981]"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">System Online</span>
</div>
<span class="text-outline-variant">•</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">v2.4.0-Enterprise</span>
<span class="text-outline-variant">•</span>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Legal &amp; Privacy</a>
</footer>
</main>
<!-- Contextual Background Elements -->
<div class="fixed inset-0 -z-10 pointer-events-none opacity-40">
<div class="absolute top-[-10%] left-[-5%] w-[400px] h-[400px] bg-primary/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[500px] h-[500px] bg-secondary/10 rounded-full blur-[120px]"></div>
</div>
</body></html>
